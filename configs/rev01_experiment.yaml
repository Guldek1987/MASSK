    interaction_seeds: [20260417, 20260511, 20260623]
    d_model: 192
    core_dropout: 0.10
    core_lr: 0.0007
    core_weight_decay: 0.004
    core_max_epochs: 44
    core_batch: 384
    core_label_smoothing: 0.025
    interaction_rank: 64

    frozen_system_sha256: c5adf21f83d0829e8aa731558e8b69bb538e1fa9b869814b7154e8e32f564ef6
    temporal_reference_nll: {V0: 0.659680, V1: 0.658327}
    endpoint: https://api.openalex.org/works
    date_range: ["2018-01-01", "2024-12-31"]
    sample_per_request: 200
    seeds: [20269024, 20276943, 20284862]
    select: id,ids,doi,title,display_name,abstract_inverted_index,publication_year,publication_date,language,type,primary_topic,keywords,referenced_works,cited_by_count
